spring.application.name=equadras

#URL de conexão com o BD
spring.datasource.url=jdbc:postgresql://localhost:5432/equadras

# usuário e senha do BD (podem ser trocados pelas variáveis de ambiente DB_USUARIO e DB_SENHA)
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_SENHA:123456}

#driver responsável por fazer a conexão com o PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# define como o Hibernate gerencia as tabelas (update = cria/atualiza sem apagar dados)
spring.jpa.hibernate.ddl-auto=update

# mostra no console as consultas SQL executadas / formata as consultas no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# define o tipo de banco utilizado (dialeto do PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# não mantém a conexão com o banco aberta durante a montagem do JSON de resposta
spring.jpa.open-in-view=false

# endereço da documentação Swagger: http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.try-it-out-enabled=true

# cadastra quadras e clientes de exemplo na primeira execução (banco vazio)
equadras.carga-inicial=true
